name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      - shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }

      - run: npm run verify

      - run: npm run release:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
